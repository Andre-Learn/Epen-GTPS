  <script>
    (() => {
      try {
        const saved = localStorage.getItem('epen-theme');
        const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && systemDark)) document.documentElement.dataset.theme = 'dark';
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="partners-page">
  <header class="site-header">
    <div class="header-inner page-width">
      <a href="index.html" class="header-back" aria-label="Kembali ke halaman utama">Kembali</a>
      <div class="header-page-title">Partner</div>
      <button class="theme-switch" type="button" id="themeButton" aria-label="Ganti tema" aria-pressed="false">
        <span class="theme-switch-label theme-light-label">Light</span>
        <span class="theme-switch-track" aria-hidden="true"><span class="theme-switch-knob"><span></span><i></i></span></span>
        <span class="theme-switch-label theme-dark-label">Dark</span>
      </button>
    </div>
  </header>

  <main class="page-width partner-page-main">
    <section class="partners-intro" id="partnersIntro">
      <span class="section-kicker">EPEN GTPS NETWORK</span>
      <h1>Partner <span>kami.</span></h1>
      <p>Temukan komunitas, creator, dan project yang menjadi bagian dari jaringan Epen GTPS.</p>
    </section>


    <section class="partner-list" id="partnerList" aria-label="Daftar partner"></section>
  </main>

  <footer class="footer" data-site-footer>
    <div class="footer-inner page-width">
      <div class="footer-copy">
        <div class="footer-brand"><span class="footer-dot"></span><strong>Epen GTPS</strong></div>
        <p>Partner network.</p>
        <span class="footer-note">Growtopia Private Server Creator</span>
      </div>
      <div class="footer-bottom">© 2026 Epen GTPS · Community, Creator &amp; Partner Network</div>
    </div>
    <img class="footer-scene" data-footer-scene alt="" aria-hidden="true" />
  </footer>
  <script src="settings.js"></script>
  <script src="script.js"></script>
</body>
</html>
