  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Epen GTPS",
    "alternateName": ["Epen GTPS", "Epen Growtopia", "Epen GTPS Indonesia"],
    "url": "https://epengtps.web.id/",
    "description": "Komunitas Growtopia dan Growtopia Private Server (GTPS) Indonesia dengan video, partner, dan direktori server GTPS.",
    "inLanguage": "id-ID",
    "publisher": {
      "@type": "Organization",
      "name": "Epen GTPS",
      "url": "https://epengtps.web.id/"
    }
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <script>
    (() => {
      try {
        const saved = localStorage.getItem('epen-theme');
        const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && systemDark)) document.documentElement.dataset.theme = 'dark';
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="home-page">
  <header class="site-header">
    <div class="header-inner page-width home-header-inner">
      <a href="/" class="header-brand" aria-label="Beranda Epen GTPS">
        <span class="avatar avatar-small" data-site-logo><span class="site-logo-fallback">E</span></span>
        <span class="header-brand-copy"><strong>Epen GTPS</strong><small>Growtopia Private Server Creator</small></span>
      </a>
      <button class="theme-switch" type="button" id="themeButton" aria-label="Ganti tema" aria-pressed="false">
        <span class="theme-switch-label theme-light-label">Light</span>
        <span class="theme-switch-track" aria-hidden="true"><span class="theme-switch-knob"><span></span><i></i></span></span>
        <span class="theme-switch-label theme-dark-label">Dark</span>
      </button>
    </div>
  </header>

  <main>
    <section class="profile-hero page-width">
      <div class="cover-art" data-site-banner>
        <div class="cover-glow"></div>
        <div class="cover-grid"></div>
        <div class="cover-copy"><strong>EPEN</strong><span>GTPS CREATOR</span></div>
        <div class="cover-orb">E</div>
      </div>
      <div class="profile-avatar-wrap"><div class="avatar profile-avatar" data-site-logo><span class="site-logo-fallback">E</span></div></div>
      <div class="profile-info">
        <h1>Epen GTPS</h1>
        <p>Growtopia Private Server Creator &amp; Community</p>
        <strong class="profile-tags">GROWTOPIA · GTPS · CONTENT CREATOR</strong>
      </div>
    </section>

    <section class="action-list page-width" id="actionList" aria-label="Menu utama"></section>

    <section class="content-section page-width" id="videos">
      <div class="section-title-row">
        <div><span class="section-kicker">LATEST CONTENT</span><h2>Video Epen GTPS</h2></div>
        <button class="section-refresh" type="button" data-video-refresh="home" aria-label="Muat ulang video terbaru"><img src="assets/icons/refresh-loop.png" alt="" aria-hidden="true"></button>
      </div>
      <div class="home-video-grid" id="homeVideoGrid"></div>
    </section>

    <section class="promote-section page-width" id="promote" data-promote-section></section>
  </main>

  <footer class="footer" data-site-footer></footer>
  <script src="settings.js"></script>
  <script src="script.js"></script>
</body>
